name: CI

on:
  push:
    branches: [ "agent/autonomous-florian-triangle", "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Selene Lint + Smoke Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Selene
        run: |
          # Download latest Selene release for Linux x86_64
          # See: https://github.com/Kampfkarren/selene/releases
          SELENE_VERSION="0.27.2"
          curl -sSL -o selene.zip "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-linux.zip"
          unzip -o selene.zip
          chmod +x selene
          sudo mv selene /usr/local/bin/selene
          selene --version

      - name: Selene Lint
        run: |
          cd ${{ github.workspace }}
          # Lint all Lua files in src/
          # Known pre-existing issues (tracked, do not block CI yet):
          #   - deprecated tick() usage — Bug #6 / #24 in BUG_AUDIT_2026-06-29.md
          #     Currently set to "warn" in .selene.toml, not "error"
          #   - Once tick() → os.clock() migration is complete,
          #     change deprecated lint from "warn" to "error" in .selene.toml
          #     and remove the || true below
          #
          # Fail CI on errors, allow warnings for now (pre-existing tech debt)
          selene src/ || {
            echo "::warning::Selene found lint issues — see output above"
            echo "Pre-existing issues tracked in BUG_AUDIT_2026-06-29.md"
            echo "Failing CI on errors only, warnings allowed during migration"
            # Re-run and check exit code — Selene exits 1 on errors, 0 on warnings-only
            # If we got here, exit code was non-zero = errors found = fail the build
            exit 1
          }
          echo "✓ Selene lint passed (warnings may exist, see above)"

      - name: Luau Syntax Check
        run: |
          cd ${{ github.workspace }}
          # Verify all .lua files parse as valid Luau
          # Uses luau-analyze if available, falls back to basic syntax check
          echo "Checking Lua syntax for all source files..."
          find src -name "*.lua" -exec sh -c 'luac -p "$1" 2>/dev/null || lua -l "$1" -e "" 2>/dev/null || echo "SKIP: $1 (no Lua runtime with Roblox globals)"' _ {} \;
          echo "✓ Syntax check complete (full type checking requires Roblox Studio / Lune with API stubs)"
          echo ""
          echo "Note: Full smoke test (tests/smoke_test.lua) requires Roblox Studio"
          echo "  to run — it uses game:GetService(), Instance.new(), etc."
          echo "  Run locally in Studio: require(game.ServerScriptService.Tests.SmokeTest).Run()"
          echo ""
          echo "CI currently validates:"
          echo "  ✓ Selene lint (undefined globals, deprecated APIs, shadowing, etc.)"
          echo "  ✓ File structure / basic syntax"
          echo ""
          echo "Future CI improvements:"
          echo "  - Run tests/smoke_test.lua headlessly via Lune + Roblox API stubs"
          echo "  - See: https://github.com/filiptibell/lune"
          echo "  - Add rojo build check: rojo build default.project.json -o game.rbxl"
          echo "  - Add luau-analyze type checking with full type definitions"

      - name: Smoke Test — Static Analysis
        run: |
          cd ${{ github.workspace }}
          echo "=== Smoke Test — Static Analysis ==="
          echo ""
          echo "Checking for known critical bugs from BUG_AUDIT_2026-06-29.md..."
          echo ""
          
          # Bug #1 / #5: HorrorEvents.ApplySanityDrain missing
          if grep -rq "ApplySanityDrain" src/ReplicatedStorage/Modules/HorrorEvents.lua; then
            echo "✓ PASS: HorrorEvents.ApplySanityDrain exists"
            APPLY_SANITY_DRAIN=1
          else
            echo "✗ FAIL: HorrorEvents.ApplySanityDrain MISSING"
            echo "  File: src/ReplicatedStorage/Modules/HorrorEvents.lua"
            echo "  Called by: src/ReplicatedStorage/Modules/EntityAI.lua:184"
            echo "  Impact: EntityAI crashes when enemy approaches player"
            echo "  Bug tracking: BUG_AUDIT_2026-06-29.md — Bug #1 / #5 — CRITICAL"
            APPLY_SANITY_DRAIN=0
          fi
          echo ""
          
          # Bug #3: Sanity decay dt bug — check if fixed
          if grep -q "decay.*dt" src/ReplicatedStorage/Modules/HorrorEvents.lua; then
            echo "⚠ WARN: HorrorEvents sanity decay multiplies by dt"
            echo "  File: src/ReplicatedStorage/Modules/HorrorEvents.lua"
            echo "  Check if dt is Heartbeat dt or actual elapsed time"
            echo "  Bug tracking: BUG_AUDIT_2026-06-29.md — Bug #3 — HIGH"
            echo "  Expected: decay should use actual elapsed time since last sanity update,"
            echo "  not Heartbeat dt, otherwise sanity drains ~15x too slowly"
          fi
          echo ""
          
          # Bug #6 / #24: tick() deprecated usage
          TICK_COUNT=$(grep -r "tick\s*(" src --include="*.lua" | wc -l)
          TICK_FILES=$(grep -rl "tick\s*(" src --include="*.lua" | wc -l)
          if [ "$TICK_COUNT" -gt 0 ]; then
            echo "⚠ WARN: tick() deprecated API used $TICK_COUNT times across $TICK_FILES files"
            echo "  Bug tracking: BUG_AUDIT_2026-06-29.md — Bug #6 / #24 — MEDIUM"
            echo "  Replace with: os.clock() for delta timing"
            echo "  Files:"
            grep -rl "tick\s*(" src --include="*.lua" | sed 's/^/    /'
          else
            echo "✓ PASS: No deprecated tick() usage found"
          fi
          echo ""
          
          # Check that critical modules export expected functions
          echo "Checking critical module exports..."
          declare -A REQUIRED_EXPORTS=(
            ["ShipController"]="Initialize Destroy UpdatePlayerWeight SetSailing BoardGhostShip ExitGhostShip"
            ["HorrorEvents"]="Initialize Destroy TriggerSanityDamage TriggerHorrorPulse GetHorrorLevel ApplySanityDrain"
            ["EntityAI"]="Initialize Destroy Create UpdateAll SpawnTestEntity"
            ["ExtractionManager"]="Initialize Destroy RegisterChest HandlePickup ExtractAtZone GetPlayerWeight"
            ["FogSystem"]="Initialize Destroy GetSafeRadius IsInSafeZone"
          )
          EXPORT_FAIL=0
          for mod in "${!REQUIRED_EXPORTS[@]}"; do
            # Find module file
            MOD_FILE=$(find src -name "${mod}.lua" | head -1)
            if [ -z "$MOD_FILE" ]; then
              echo "  ✗ Module file not found: $mod"
              EXPORT_FAIL=1
              continue
            fi
            for fn in ${REQUIRED_EXPORTS[$mod]}; do
              if grep -q "function ${mod}\.${fn}\|${mod}\.${fn}\s*=" "$MOD_FILE"; then
                : # found
              else
                echo "  ✗ MISSING EXPORT: ${mod}.${fn}() — searched in $MOD_FILE"
                EXPORT_FAIL=1
              fi
            done
          done
          if [ "$EXPORT_FAIL" -eq 0 ]; then
            echo "✓ PASS: All critical module exports present"
          else
            echo "✗ FAIL: One or more critical exports missing (see above)"
          fi
          echo ""
          
          # Summary
          echo "=== Smoke Test Summary ==="
          if [ "${APPLY_SANITY_DRAIN:-0}" -eq 0 ] || [ "$EXPORT_FAIL" -ne 0 ]; then
            echo "❌ SMOKE TEST FAILED — critical bugs detected"
            echo ""
            echo "This is EXPECTED for the current state of agent/autonomous-florian-triangle"
            echo "See BUG_AUDIT_2026-06-29.md for full details and fix tracking."
            echo ""
            echo "To make CI pass:"
            echo "  1. Implement HorrorEvents.ApplySanityDrain() — fixes EntityAI crash"
            echo "     (Bug #1 / #5 — CRITICAL)"
            echo "  2. Fix remaining export mismatches listed above"
            echo ""
            echo "Failing CI build to prevent merging known-critical bugs to dev/main."
            exit 1
          else
            echo "✅ SMOKE TEST PASSED"
            exit 0
          fi

      - name: Summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See job logs above for detailed Selene lint output and smoke test results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Known Issues (tracked, do not block CI during migration)" >> $GITHUB_STEP_SUMMARY
          echo "- \`tick()\` deprecated API usage — Bug #6 — migrate to \`os.clock()\`" >> $GITHUB_STEP_SUMMARY
          echo "- See \`BUG_AUDIT_2026-06-29.md\` for full bug inventory" >> $GITHUB_STEP_SUMMARY
